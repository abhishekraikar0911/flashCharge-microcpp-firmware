name: flashCharge Firmware CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run Native Unit Tests
      run: pio test -e native_tests

    - name: Verify ESP32 Production Build
      run: pio run -e charger_esp32_production

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v3
      with:
        name: flashcharge-firmware-${{ github.sha }}
        path: |
          .pio/build/charger_esp32_production/firmware.bin
          .pio/build/charger_esp32_production/firmware.elf
        retention-days: 30
