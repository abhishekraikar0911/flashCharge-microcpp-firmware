; PlatformIO Configuration for Production Build
; Rivot Motors - OCPP Charging Station
; ============================================

[platformio]
default_envs = charger_esp32_production
src_dir = src
include_dir = include
lib_dir = lib
build_dir = .pio/build

; ========== PRODUCTION BUILD ENVIRONMENT ==========
[env:charger_esp32_production]
platform = espressif32@6.12.0
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.psram_mode = disabled
framework = arduino

upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
monitor_filters =
;    default
;    time
;    log2file
    esp32_exception_decoder
monitor_raw = yes
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -O3
    -DMOCPP_USE_WS=1
    -DMOCPP_USE_ARDUINO=1
    -DMOCPP_USE_PLATFORMIO=1
    -DMO_ENABLE_MBEDTLS=1
    -DENABLE_OTA_UPDATES=1
    -DENABLE_REMOTE_LOGGING=1
    -DENABLE_DIAGNOSTICS=1
    -DENABLE_WATCHDOG=1
    -DENABLE_CRASH_RECOVERY=1
    -DMBEDTLS_SSL_MAX_CONTENT_LEN=4096
    -DMBEDTLS_SSL_IN_CONTENT_LEN=4096
    -DMBEDTLS_SSL_OUT_CONTENT_LEN=4096
    -DLOG_LEVEL=LOG_LEVEL_WARN
    -DCORE_DEBUG_LEVEL=3
    -DMO_DBG_LEVEL=MO_DL_WARN
    -DMO_REQUEST_CACHE_MAXSIZE=20
    -DMO_METERVALUES_CACHE_MAXSIZE=50
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    -DCONFIG_ESP_TASK_WDT=0
    -DCONFIG_ESP_TASK_WDT_PANIC=0
    -DMO_CUSTOM_CONSOLE

build_src_filter =
    +<main.cpp>
    +<app/>
    +<tasks/>
    +<system/>
    +<services/>
    +<hal/>
    +<bsp/>
    +<drivers/>
    +<config/>
    -<.git/> -<.svn/> -<.pio/> -<.vscode/> -<docs/> -<examples/>

lib_deps =
    MicroOcpp@1.2.0
    bblanchon/ArduinoJson@6.21.3
    Links2004/WebSockets@2.7.3
    https://github.com/autowp/arduino-mcp2515.git#master
    vshymanskyy/TinyGSM@0.11.7
    govorox/SSLClient

board_build.partitions = min_spiffs.csv
build_type = release

; ========== DEBUG BUILD ENVIRONMENT ==========
[env:charger_esp32_debug]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
extends = charger_esp32_production
build_type = debug
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -O0
    -g
    -DMOCPP_USE_WS=1
    -DMOCPP_USE_ARDUINO=1
    -DMOCPP_USE_PLATFORMIO=1
    -DCORE_DEBUG_LEVEL=4
    -DLOG_LEVEL=LOG_LEVEL_DEBUG
    -DENABLE_OTA_UPDATES=1
    -DENABLE_REMOTE_LOGGING=1
    -DENABLE_DIAGNOSTICS=1
    -DENABLE_WATCHDOG=1
    -DENABLE_CRASH_RECOVERY=1

; ========== NATIVE UNIT TEST ENVIRONMENT (runs on Windows, no ESP32 required) ==========
[env:native_tests]
platform = native
build_flags =
    -std=c++17
    -DNATIVE_TEST_BUILD
    -DUNITY_OUTPUT_COLOR
    -I test/stubs
    -I include
test_framework = unity
test_filter = test_*
